<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Student</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<nav class="navbar navbar-dark bg-dark">
    <div class="container">

        <a class="navbar-brand"
           href="{{ url_for('dashboard') }}">
            Student Management System
        </a>

        <div>

            <a href="{{ url_for('dashboard') }}"
               class="btn btn-outline-light btn-sm">
                Dashboard
            </a>

            <a href="{{ url_for('students') }}"
               class="btn btn-outline-light btn-sm">
                Students
            </a>

            <a href="{{ url_for('add_student') }}"
               class="btn btn-success btn-sm">
                Add Student
            </a>

        </div>

    </div>
</nav>


<div class="container mt-5">

    <div class="card shadow">

        <div class="card-body">

            <h3 class="mb-4">Edit Student</h3>

            <form method="POST">

                <div class="row">

                    <!-- Name -->

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Name
                        </label>

                        <input type="text"
                               name="name"
                               class="form-control"
                               value="{{ student['name'] }}"
                               required>

                    </div>


                    <!-- Email -->

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Email
                        </label>

                        <input type="email"
                               name="email"
                               class="form-control"
                               value="{{ student['email'] }}"
                               required>

                    </div>


                    <!-- Phone -->

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Phone
                        </label>

                        <input type="text"
                               name="phone"
                               class="form-control"
                               value="{{ student['phone'] }}"
                               required>

                    </div>


                    <!-- Department -->

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Department
                        </label>

                        <select name="department"
                                class="form-control"
                                required>

                            <option value="CSE"
                                {% if student['department'] == 'CSE' %}selected{% endif %}>
                                CSE
                            </option>

                            <option value="ECE"
                                {% if student['department'] == 'ECE' %}selected{% endif %}>
                                ECE
                            </option>

                            <option value="IT"
                                {% if student['department'] == 'IT' %}selected{% endif %}>
                                IT
                            </option>

                            <option value="DS"
                                {% if student['department'] == 'DS' %}selected{% endif %}>
                                DS
                            </option>

                            <option value="AI"
                                {% if student['department'] == 'AI' %}selected{% endif %}>
                                AI
                            </option>

                            <option value="EEE"
                                {% if student['department'] == 'EEE' %}selected{% endif %}>
                                EEE
                            </option>

                        </select>

                    </div>


                    <!-- Year -->

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Year
                        </label>

                        <select name="year"
                                class="form-control"
                                required>

                            <option value="1"
                                {% if student['year'] == 1 %}selected{% endif %}>
                                1st Year
                            </option>

                            <option value="2"
                                {% if student['year'] == 2 %}selected{% endif %}>
                                2nd Year
                            </option>

                            <option value="3"
                                {% if student['year'] == 3 %}selected{% endif %}>
                                3rd Year
                            </option>

                            <option value="4"
                                {% if student['year'] == 4 %}selected{% endif %}>
                                4th Year
                            </option>

                        </select>

                    </div>


                    <!-- Marks -->

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Marks
                        </label>

                        <input type="number"
                               name="marks"
                               class="form-control"
                               value="{{ student['marks'] }}"
                               min="0"
                               max="100"
                               required>

                    </div>


                    <!-- Attendance -->

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Attendance
                        </label>

                        <input type="number"
                               name="attendance"
                               class="form-control"
                               value="{{ student['attendance'] }}"
                               min="0"
                               max="100"
                               required>

                    </div>

                </div>


                <!-- Buttons -->

                <button type="submit"
                        class="btn btn-warning">
                    Update Student
                </button>

                <a href="{{ url_for('students') }}"
                   class="btn btn-secondary">
                    Cancel
                </a>

            </form>

        </div>

    </div>

</div>

</body>
</html>
